  crate-deleted: "<red>Kasa başarıyla kaldırıldı ve hologramı silindi.</red>"
  crate-not-found: "<red>Baktığınız blokta tanımlı bir kasa bulunamadı!</red>"
  crate-list-header: "<gold>=== Kayıtlı Kasalar ===</gold>"
  crate-list-item: "<gray>- <aqua>{id}</aqua> | Kademe: {tier} | Konum: <yellow>{world}, {x}, {y}, {z}</yellow></gray>"
  crate-list-empty: "<yellow>Henüz yerleştirilmiş bir kasa bulunmuyor.</yellow>"
  reloaded: "<green>Tüm kasa yapılandırmaları ve ödüller başarıyla yenilendi!</green>"
  target-block-invalid: "<red>Lütfen bir sandık veya bloğa bakarak bu komutu kullanın!</red>"
  break-deny: "<red>Bu kasa bloğunu kıramazsınız! Kasayı kaldırmak için <yellow>/kasasil</yellow> veya Shift+Sol Tık kullanın.</red>"

