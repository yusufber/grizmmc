prefix: "<gradient:#ff8a00:#e52e71><b>[GrizmCrates]</b></gradient> <gray>»</gray> "

messages:
  no-permission: "<red>Bu komutu kullanmak için yetkiniz yok!</red>"
  player-only: "<red>Bu komutu yalnızca oyuncular kullanabilir!</red>"
  invalid-tier: "<red>Geçersiz kasa kademesi! Mevcut kademeler: <yellow>{tiers}</yellow></red>"
  player-not-found: "<red>Oyuncu bulunamadı veya çevrimdışı: <yellow>{player}</yellow></red>"
  key-given: "<green><yellow>{amount}</yellow> adet <yellow>{key}</yellow> anahtarı <aqua>{player}</aqua> adlı oyuncuya verildi.</green>"
  key-received: "<green>Hesabınıza <yellow>{amount}</yellow> adet <yellow>{key}</yellow> anahtarı eklendi!</green>"
  no-key: "<red>Bu kasayı açmak için bir {key} <red>anahtarına ihtiyacınız var!</red>"
